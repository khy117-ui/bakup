# ------------------------------------------------------------------
# 굿배송항공 요금표 관리 페이지(/admin/) 외부 접근 제한 — nginx
# server { } 블록 안에 아래 location 을 추가하세요.
#   - 허용 IP(사무실 고정 IP)에서 접속하고  AND  관리자 계정(Basic 인증)으로 로그인해야 열립니다.
#   - 비밀번호 파일:  htpasswd -c /etc/nginx/goodpost.htpasswd admin
#   ※ 공개 요금표가 읽는 /assets/data/rates.xlsx 는 제한하지 않습니다.
# ------------------------------------------------------------------
location ^~ /admin/ {
    satisfy all;                 # IP 허용 + 인증 성공을 모두 요구

    allow 127.0.0.1;
    allow 61.43.120.209;         # 사무실 고정 IP로 교체
    allow 117.110.98.252;
    allow 175.209.40.226;
    allow 211.206.111.242;
    allow 221.151.149.0/24;
    deny  all;

    auth_basic           "GOODPOST 요금표 관리";
    auth_basic_user_file /etc/nginx/goodpost.htpasswd;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    client_max_body_size 5m;     # 엑셀 업로드 상한

    # PHP 업로드 엔드포인트(admin/upload.php)를 쓰는 경우
    location ~ ^/admin/upload\.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php-fpm.sock;   # 서버 환경에 맞게 수정
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}

# 요금표 원본은 공개 페이지가 읽어야 하므로 열어 두되, 캐시는 짧게
location = /assets/data/rates.xlsx {
    add_header Cache-Control "no-cache" always;
}
